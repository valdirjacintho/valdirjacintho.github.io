<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificar Integridade SEEAI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f8;font-family:Arial,Helvetica,sans-serif;color:#263238}
.wrap{max-width:820px;margin:52px auto;padding:0 20px}
.card{background:#fff;border:1px solid #d9e1e5;padding:30px}
.brand{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.brand img{width:68px;height:auto;display:block}
h1{margin:0;color:#163f56;font-size:25px}
.sub{color:#71899a;font-size:12px;margin-top:4px}
hr{border:0;border-top:1px solid #d9e1e5;margin:22px 0}
label{display:block;font-weight:700;color:#163f56;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:260px;border:1px solid #b9c7cf;padding:12px 13px;font:14px Consolas,monospace;text-transform:uppercase;outline:none}
input:focus{border-color:#2b6681}
button,.btn{border:0;background:#163f56;color:#fff;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#2b6681}
.msg{margin-top:16px;font-size:13px;line-height:20px}
.ok{color:#2b6681;font-weight:700}
.pending{color:#856404;font-weight:700}
.err{color:#b3261e;font-weight:700}
.grid{display:grid;grid-template-columns:190px 1fr;gap:10px 14px;margin-top:18px;font-size:13px;line-height:19px}
.k{font-weight:700}
.mono{font-family:Consolas,monospace;font-size:11px;word-break:break-all}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.help{font-size:12px;line-height:18px;color:#71899a}
@media(max-width:760px){.grid{grid-template-columns:1fr;gap:3px}.k{margin-top:8px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="brand">
<img src="https://seeaidata.com.br/img/seeai-logo.png" alt="SEEAI">
<div><h1>Verificar Integridade SEEAI</h1><div class="sub">Integridade e existência temporal de mensagens SEEAI</div></div>
</div>
<hr>
<label for="codigo">Código de integridade</label>
<div class="row">
<input id="codigo" autocomplete="off" spellcheck="false" placeholder="SE-AAAAMMDD-XXXXXXXX" maxlength="20">
<button onclick="verificar()">Verificar código</button>
</div>
<div id="result" class="msg"></div>
<hr>
<div class="help">
A consulta é feita no serviço SEEAI hospedado no Google. O conteúdo original do e-mail não é publicado.
</div>
</div></div>

<script>
const BACKEND_GENERIC = 'https://script.google.com/macros/s/AKfycbyPvE8agXRg8HRaCpHJ-M17BQ2IUujU_qtT_-XwmxZqUX1aH5DmtQBOXJ7HydNmAeEw/exec';
const BACKEND_DOMAIN  = 'https://script.google.com/a/seeaidata.com.br/macros/s/AKfycbyPvE8agXRg8HRaCpHJ-M17BQ2IUujU_qtT_-XwmxZqUX1aH5DmtQBOXJ7HydNmAeEw/exec';

function idValido(id){return /^SE-\d{8}-[A-F0-9]{8}$/.test(id);}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function isMobile(){
  return /Android|iPhone|iPad|iPod|Mobile|wv/i.test(navigator.userAgent || "") ||
         (window.matchMedia && window.matchMedia("(max-width: 760px)").matches);
}

function verificar(){
  const id=(document.getElementById("codigo").value||"").trim().toUpperCase();
  const result=document.getElementById("result");
  if(!idValido(id)){
    result.innerHTML='<span class="err">Código inválido.</span>';
    return;
  }

  result.innerHTML='Consultando registro...';

  // Em Android/mobile, o endpoint genérico script.google.com pode ser reescrito
  // pelo roteamento de contas do Google e cair na tela "Google Drive - arquivo não encontrado".
  // Por isso tentamos primeiro a URL qualificada pelo domínio Workspace.
  const urls = isMobile()
    ? [BACKEND_DOMAIN, BACKEND_GENERIC]
    : [BACKEND_GENERIC, BACKEND_DOMAIN];

  consultarJsonp(id, urls, 0);
}

function consultarJsonp(id, urls, idx){
  const result=document.getElementById("result");

  if(idx >= urls.length){
    result.innerHTML=
      '<span class="err">Não foi possível consultar o serviço SEEAI neste navegador.</span><br>'+
      '<span style="font-size:12px;color:#71899a">Tente novamente em alguns segundos. O registro permanece preservado no serviço Google.</span>';
    return;
  }

  const cb="seeai_cb_"+Date.now()+"_"+idx;
  let finished=false;
  const script=document.createElement("script");

  function cleanup(){
    try{delete window[cb];}catch(e){}
    try{script.remove();}catch(e){}
  }

  function next(){
    if(finished)return;
    finished=true;
    clearTimeout(timer);
    cleanup();
    consultarJsonp(id, urls, idx+1);
  }

  window[cb]=function(data){
    if(finished)return;
    finished=true;
    clearTimeout(timer);
    cleanup();
    render(data);
  };

  script.src=urls[idx]+"?callback="+encodeURIComponent(cb)+"&id="+encodeURIComponent(id)+"&_="+Date.now();
  script.async=true;
  script.onerror=next;
  document.body.appendChild(script);

  const timer=setTimeout(next,7000);
}

function render(d){
  const r=document.getElementById("result");

  if(!d || d.state==="NOT_FOUND"){
    r.innerHTML='<span class="err">Código não localizado.</span>';
    return;
  }

  if(d.state==="PENDING"){
    r.innerHTML='<span class="pending">Registro em processamento.</span><br>'+
      'O e-mail já foi enviado. A prova RFC 3161 é finalizada automaticamente em aproximadamente um minuto.';
    return;
  }

  if(d.state==="ERROR"){
    r.innerHTML='<span class="err">Não foi possível finalizar este registro.</span>';
    return;
  }

  r.innerHTML='<div class="ok">✓ Registro íntegro e validado</div>'+
    '<div class="grid">'+
    '<div class="k">ID</div><div class="mono">'+esc(d.id)+'</div>'+
    '<div class="k">Horário de Brasília</div><div>'+esc(d.timestampLocal)+'</div>'+
    '<div class="k">Marca temporal UTC</div><div>'+esc(d.timestampUtc)+'</div>'+
    '<div class="k">Autoridade</div><div>'+esc(d.authority)+'</div>'+
    '<div class="k">Padrão</div><div>'+esc(d.standard)+'</div>'+
    '<div class="k">Método de normalização</div><div>'+esc(d.canonicalization)+'</div>'+
    '<div class="k">SHA-256</div><div class="mono">'+esc(d.sha256)+'</div>'+
    '<div class="k">SHA-256 da prova</div><div class="mono">'+esc(d.proofSha256)+'</div>'+
    '</div>'+
    '<div class="actions"><button onclick="baixarProva()">Baixar prova RFC 3161</button></div>';

  window.__seeaiProof=d;
}

function baixarProva(){
  const d=window.__seeaiProof;
  if(!d || !d.tsrBase64)return;

  try{
    const bin=atob(d.tsrBase64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);

    const blob=new Blob([bytes],{type:"application/timestamp-reply"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(d.id||"seeai")+".tsr";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  }catch(e){
    alert("Não foi possível baixar a prova neste navegador.");
  }
}

document.getElementById("codigo").addEventListener("keydown",e=>{
  if(e.key==="Enter")verificar();
});

const q=new URLSearchParams(location.search).get("id");
if(q){
  document.getElementById("codigo").value=q.toUpperCase();
  verificar();
}
</script>
</body>
</html>
